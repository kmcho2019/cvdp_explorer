name: Deploy CVDP Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Process CVDP dataset
        run: uv run python data/scripts/process_cvdp.py

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify Pages artifact layout
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO}" = "${OWNER}.github.io" ]; then
            SITE_ORIGIN="https://${OWNER}.github.io"
            EXPECTED_ASSET_PREFIX="/assets/"
          else
            SITE_ORIGIN="https://${OWNER}.github.io/${REPO}"
            EXPECTED_ASSET_PREFIX="/${REPO}/assets/"
          fi

          test -f frontend/dist/index.html
          test -f frontend/dist/data/index.json
          test -f frontend/dist/robots.txt
          test -f frontend/dist/sitemap.xml

          if ls frontend/public/google*.html >/dev/null 2>&1; then
            for verification_file in frontend/public/google*.html; do
              test -f "frontend/dist/$(basename "$verification_file")"
            done
          fi

          if ! grep -q "${EXPECTED_ASSET_PREFIX}" frontend/dist/index.html; then
            echo "Expected asset prefix '${EXPECTED_ASSET_PREFIX}' not found in dist/index.html"
            sed -n '1,40p' frontend/dist/index.html
            exit 1
          fi

          if ! grep -q '<link rel="canonical"' frontend/dist/index.html; then
            echo 'Canonical link tag missing from index.html'
            exit 1
          fi

          if ! grep -q 'name="twitter:site"' frontend/dist/index.html; then
            echo 'twitter:site missing from index.html'
            exit 1
          fi

          if ! grep -q 'name="twitter:creator"' frontend/dist/index.html; then
            echo 'twitter:creator missing from index.html'
            exit 1
          fi

          if ! grep -q 'name="twitter:url"' frontend/dist/index.html; then
            echo 'twitter:url missing from index.html'
            exit 1
          fi

          if ! grep -q 'property="og:image"' frontend/dist/index.html; then
            echo 'og:image missing from index.html'
            exit 1
          fi

          if ! grep -q 'twitter:image' frontend/dist/index.html; then
            echo 'twitter:image missing from index.html'
            exit 1
          fi

          if ! grep -q 'application/ld+json' frontend/dist/index.html; then
            echo 'JSON-LD script block missing from index.html'
            exit 1
          fi

          if ! grep -q 'id="site-jsonld"' frontend/dist/index.html; then
            echo 'site JSON-LD script block missing from index.html'
            exit 1
          fi

          if ! grep -q 'id="record-jsonld"' frontend/dist/index.html; then
            echo 'record JSON-LD script placeholder missing from index.html'
            exit 1
          fi

          if ! grep -q "${SITE_ORIGIN}" frontend/dist/sitemap.xml; then
            echo 'Sitemap does not include canonical site root'
            exit 1
          fi

          RECORD_COUNT=$(node -e "const fs = require('fs'); const path = 'frontend/dist/data/index.json'; const data = JSON.parse(fs.readFileSync(path, 'utf8')); process.stdout.write(String(data.length));")
          if [ "${RECORD_COUNT}" -gt 0 ]; then
            FIRST_RECORD_ID=$(node -e "const fs = require('fs'); const path = 'frontend/dist/data/index.json'; const data = JSON.parse(fs.readFileSync(path, 'utf8')); process.stdout.write(data[0]?.id || '');")
            if [ -n "${FIRST_RECORD_ID}" ] && ! grep -Fq "?id=${FIRST_RECORD_ID}" frontend/dist/sitemap.xml; then
              echo "Sitemap missing record deep-link for id: ${FIRST_RECORD_ID}"
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
